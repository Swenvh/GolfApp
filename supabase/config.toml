# Supabase CLI-configuratie (lokaal: `supabase start`, daarna `supabase db reset`)
project_id = "golfapp"

[api]
port = 54321
schemas = ["public"]

[db]
port = 54322
major_version = 17

[db.seed]
enabled = true
sql_paths = ["./seed.sql", "./seed_demo.sql"]

[auth]
site_url = "http://localhost:3000"
additional_redirect_urls = ["greenside://"]
enable_signup = true    # inloggen met een code maakt het account aan; het ziet pas iets na koppeling
                        # aan een lid of beheerdersuitnodiging met hetzelfde e-mailadres (claim_my_accounts)
jwt_expiry = 3600                      # toegangstoken 1 uur geldig
enable_refresh_token_rotation = true   # een gestolen verversingstoken werkt maar één keer
refresh_token_reuse_interval = 10
minimum_password_length = 10           # alleen het reviewaccount heeft een wachtwoord
password_requirements = "lower_upper_letters_digits"

# Tegen raden van codes en massaal aanmelden (per uur, per IP-adres waar het kan)
[auth.rate_limit]
email_sent = 1000         # hele project per uur: uitnodigingen aan alle leden + codes bij de lancering (vereist eigen SMTP)
sign_in_sign_ups = 30
token_verifications = 30
token_refresh = 150

[auth.email]
enable_signup = true
enable_confirmations = true   # e-mailadres moet bewezen zijn; anders geen koppeling met een lid (zie claim_my_accounts)
otp_length = 6
otp_expiry = 900               # code 15 minuten geldig
max_frequency = "30s"          # niet vaker dan eens per 30 seconden een nieuwe code
double_confirm_changes = true  # e-mailadres wijzigen: bevestigen op het oude én het nieuwe adres
secure_password_change = true  # wachtwoord wijzigen alleen na recent inloggen

[functions.mollie-webhook]
verify_jwt = false   # Mollie stuurt geen Supabase-JWT; status wordt bij Mollie geverifieerd

# E-mails met een 6-cijferige code (de app logt in met een code, niet met een link).
# Op het gehoste Supabase-project dezelfde teksten instellen via Authentication → Email Templates.
[auth.email.template.magic_link]
subject = "Je inlogcode voor Greenside"
content_path = "./supabase/templates/magic_link.html"

# Eerste keer inloggen met een nieuw adres: zelfde e-mail met code
[auth.email.template.confirmation]
subject = "Je inlogcode voor Greenside"
content_path = "./supabase/templates/magic_link.html"

[auth.email.template.invite]
subject = "De app van je golfclub staat klaar"
content_path = "./supabase/templates/invite.html"
