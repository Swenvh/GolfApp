name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  apps:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Unit tests (gedeelde logica)
        run: pnpm --filter @golfapp/shared test
      - name: Typecheck
        run: pnpm -r typecheck
      - name: Build beheeromgeving
        run: pnpm --filter @golfapp/admin build
        env:
          NEXT_PUBLIC_SUPABASE_URL: http://127.0.0.1:54321
          NEXT_PUBLIC_SUPABASE_ANON_KEY: ci-placeholder

  database:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - name: Migraties, seed en RLS-tests
        run: ./supabase/tests/run-local.sh
        env:
          PGHOST: localhost
          PGUSER: postgres
          PGPASSWORD: postgres
